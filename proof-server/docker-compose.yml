# Local Midnight proof server.
#
# This is the piece that turns circuit *execution* into an actual ZK proof.
# Without it the app can run circuits and enforce asserts (which is what the
# in-browser demo does today) but produces nothing a verifier could check.
#
#   docker compose -f proof-server/docker-compose.yml up
#
# Then point the app at http://localhost:6300. Note that a proof server is
# useless without proving keys -- generate those via the proving-keys workflow
# first, since this machine's CPU cannot.
services:
  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    container_name: darkstake-proof-server
    # Network must match the wallet you funded AND the CLI's --network. A proof
    # server on the wrong network produces proofs the chain will not accept.
    #   MIDNIGHT_NETWORK=preprod docker compose -f proof-server/docker-compose.yml up -d --force-recreate
    command: ["midnight-proof-server", "--network", "${MIDNIGHT_NETWORK:-preview}"]
    ports:
      - "6300:6300"
    restart: unless-stopped
